[env:nrf51_rcqr01]
platform = nordicnrf51
board = bbcmicrobit_stlink
framework = arduino

# Local SDK root is defined directly in platformio.ini.
# The project uses the default SDK copy under ../nRF5_SDK_12.3.0_d7731ad

build_flags =
  -DNRF_SDK_DIR="../nRF5_SDK_12.3.0_d7731ad"
  -DNRF51822
  -I.
  -I.
  -Isrc
  -I../nRF5_SDK_12.3.0_d7731ad/components/drivers_nrf/hal
  -I../nRF5_SDK_12.3.0_d7731ad/components/drivers_nrf/delay
  -I../nRF5_SDK_12.3.0_d7731ad/components/drivers_nrf/clock
  -I../nRF5_SDK_12.3.0_d7731ad/components/drivers_nrf/common
  -I../nRF5_SDK_12.3.0_d7731ad/components/drivers_nrf/spi_master
  -I../nRF5_SDK_12.3.0_d7731ad/components/drivers_nrf/rtc
  -I../nRF5_SDK_12.3.0_d7731ad/components/libraries/timer
  -I../nRF5_SDK_12.3.0_d7731ad/components/libraries/ic_info
  -I../nRF5_SDK_12.3.0_d7731ad/components/libraries/log
  -I../nRF5_SDK_12.3.0_d7731ad/components/libraries/log/src
  -I../nRF5_SDK_12.3.0_d7731ad/components/libraries/low_power_pwm
  -I../nRF5_SDK_12.3.0_d7731ad/components/libraries/util
  -I../nRF5_SDK_12.3.0_d7731ad/components/proprietary_rf/esb
  -I../nRF5_SDK_12.3.0_d7731ad/components/softdevice/s130/headers
  -Iinclude
  -IuGFX
  -IuGFX/drivers/gdisp/ST7586
  -IuGFX/src

  # (moved) build_src_filter moved out of build_flags below

# Include project source and uGFX (default src/ scan will be used)
# To include additional directories add `lib_extra_dirs = uGFX` or
# configure `build_src_filter` if you need fine-grained control.
lib_extra_dirs = uGFX/src, lib/nrf5_sdk

# Prevent building fatfs example documents which are not needed for the project

# Use the project's custom linker script and startup if needed
board_build.ldscript = ../nRF5_SDK_12.3.0_d7731ad/components/softdevice/s130/toolchain/armgcc/armgcc_s130_nrf51822_xxaa.ld
upload_protocol = stlink
debug_tool = stlink
debug_init_break =
# RTT setup is intentionally manual.  A breakpoint command list that starts
# an OpenOCD server and calls continue can desynchronize VS Code's MI client.
debug_extra_cmds =

# Reduce verbose output on initial runs
;
# When building without a PlatformIO framework we rely on the Nordic SDK
# C sources being available under the path defined above in platformio.ini.
# You will likely need to add specific SDK .c files (from components) to
# `src/` or `lib/` or extend this file with `lib_extra_dirs` if needed.

[env:nrf51_rcqr01_standalone]
extends = env:nrf51_rcqr01

# Standalone nRF51822 image. The vector table is at 0x00000000 and the
# complete flash/RAM ranges are available.
board_build.ldscript = nrf51_xxaa.ld
upload_protocol = stlink
debug_tool = stlink

# The reset vector is valid at address zero; no S130 handoff is needed.
debug_init_break = tbreak src/main.c:63
debug_extra_cmds =
  source scripts/start-rtt.gdb
  commands
    silent
    start-rtt
  end
